<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .title { font: 600 26px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #374151; }
      .box-title { font: 700 19px Arial, sans-serif; fill: #111827; }
      .text { font: 13px Arial, sans-serif; fill: #111827; }
      .small { font: 12px Arial, sans-serif; fill: #374151; }
      .line { stroke: #1f2937; stroke-width: 1.3; }
      .solid { stroke: #111827; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="1500" height="980" fill="#ffffff"/>
  <text x="90" y="46" class="title">Sabor Kiosco - Sistema de Pedidos</text>
  <text x="90" y="76" class="subtitle">Boceto corregido final: dominio del pedido y flujo del kiosco</text>

  <!-- Personal de Atención -->
  <rect x="80" y="120" width="200" height="200" fill="#ffd8a8" class="solid"/>
  <line x1="80" y1="165" x2="280" y2="165" class="line"/>
  <line x1="80" y1="235" x2="280" y2="235" class="line"/>
  <text x="110" y="145" class="box-title">PersonalAtencion</text>
  <text x="95" y="182" class="text">- id</text>
  <text x="95" y="202" class="text">- nombre</text>
  <text x="95" y="222" class="text">- rol</text>
  <text x="95" y="252" class="text">registrarPedido()</text>
  <text x="95" y="270" class="text">modificarPedido()</text>
  <text x="95" y="288" class="text">enviarPedidoACocina()</text>

  <!-- Cocina -->
  <rect x="80" y="390" width="200" height="160" fill="#e9ecef" class="solid"/>
  <line x1="80" y1="430" x2="280" y2="430" class="line"/>
  <text x="150" y="410" class="box-title">Cocina</text>
  <text x="95" y="455" class="text">recibirPedido()</text>
  <text x="95" y="475" class="text">prepararPedido()</text>
  <text x="95" y="495" class="text">marcarPedidoListo()</text>

  <!-- Encargado -->
  <rect x="80" y="600" width="200" height="160" fill="#d0ebff" class="solid"/>
  <line x1="80" y1="640" x2="280" y2="640" class="line"/>
  <text x="140" y="620" class="box-title">Encargado</text>
  <text x="95" y="665" class="text">supervisarPedidos()</text>
  <text x="95" y="685" class="text">cambiarEstadoPedido()</text>
  <text x="95" y="705" class="text">cerrarPedido()</text>

  <!-- Cliente -->
  <rect x="80" y="800" width="200" height="150" fill="#f3d9fa" class="solid"/>
  <line x1="80" y1="840" x2="280" y2="840" class="line"/>
  <text x="150" y="820" class="box-title">Cliente</text>
  <text x="95" y="865" class="text">solicitarPedido()</text>
  <text x="95" y="885" class="text">retirarPedido()</text>
  <text x="95" y="905" class="text">abonarPedido()</text>

  <!-- Pedido -->
  <rect x="430" y="120" width="360" height="410" fill="#a5d8ff" class="solid"/>
  <line x1="430" y1="165" x2="790" y2="165" class="line"/>
  <line x1="430" y1="315" x2="790" y2="315" class="line"/>
  <text x="553" y="145" class="box-title">Pedido</text>
  <text x="450" y="182" class="text">- numero</text>
  <text x="450" y="202" class="text">- fechaHora</text>
  <text x="450" y="222" class="text">- nombreRetiro</text>
  <text x="450" y="242" class="text">- estado</text>
  <text x="450" y="262" class="text">- prioritario</text>
  <text x="450" y="335" class="text">agregarItem()</text>
  <text x="450" y="355" class="text">quitarItem()</text>
  <text x="450" y="375" class="text">modificarItem()</text>
  <text x="450" y="395" class="text">calcularTotal()</text>
  <text x="450" y="415" class="text">cambiarEstado()</text>
  <text x="450" y="435" class="text">cancelar()</text>
  <text x="450" y="455" class="text">registrarPago()</text>

  <!-- ItemPedido -->
  <rect x="900" y="120" width="220" height="180" fill="#d3f9d8" class="solid"/>
  <line x1="900" y1="165" x2="1120" y2="165" class="line"/>
  <line x1="900" y1="240" x2="1120" y2="240" class="line"/>
  <text x="968" y="145" class="box-title">ItemPedido</text>
  <text x="920" y="182" class="text">- cantidad</text>
  <text x="920" y="202" class="text">- precioUnitario</text>
  <text x="920" y="222" class="text">- subtotal</text>
  <text x="920" y="255" class="text">calcularSubtotal()</text>

  <!-- Producto -->
  <rect x="900" y="390" width="220" height="180" fill="#fff3bf" class="solid"/>
  <line x1="900" y1="435" x2="1120" y2="435" class="line"/>
  <line x1="900" y1="512" x2="1120" y2="512" class="line"/>
  <text x="972" y="415" class="box-title">Producto</text>
  <text x="920" y="454" class="text">- codigo</text>
  <text x="920" y="474" class="text">- descripcion</text>
  <text x="920" y="494" class="text">- precioBase</text>
  <text x="920" y="525" class="text">obtenerPrecio()</text>

  <!-- Personalizacion -->
  <rect x="1180" y="120" width="220" height="180" fill="#ffe8cc" class="solid"/>
  <line x1="1180" y1="165" x2="1400" y2="165" class="line"/>
  <line x1="1180" y1="240" x2="1400" y2="240" class="line"/>
  <text x="1200" y="145" class="box-title">Personalizacion</text>
  <text x="1200" y="182" class="text">- tipo</text>
  <text x="1200" y="202" class="text">- descripcion</text>
  <text x="1200" y="222" class="text">- precioAdicional</text>
  <text x="1200" y="255" class="text">calcularAdicional()</text>

  <!-- Pago -->
  <rect x="1180" y="390" width="220" height="180" fill="#d0bfff" class="solid"/>
  <line x1="1180" y1="435" x2="1400" y2="435" class="line"/>
  <line x1="1180" y1="512" x2="1400" y2="512" class="line"/>
  <text x="1275" y="415" class="box-title">Pago</text>
  <text x="1200" y="454" class="text">- monto</text>
  <text x="1200" y="474" class="text">- fechaHora</text>
  <text x="1200" y="494" class="text">- formaPago</text>
  <text x="1200" y="525" class="text">registrarPago()</text>

  <!-- Relaciones -->
  <line x1="280" y1="220" x2="430" y2="220" class="solid"/>
  <line x1="280" y1="470" x2="430" y2="470" class="solid"/>
  <line x1="280" y1="680" x2="430" y2="680" class="solid"/>
  <line x1="280" y1="875" x2="430" y2="875" class="solid"/>

  <line x1="790" y1="220" x2="900" y2="220" class="solid"/>
  <line x1="1010" y1="300" x2="1010" y2="390" class="solid"/>
  <line x1="1120" y1="220" x2="1180" y2="220" class="solid"/>
  <line x1="790" y1="470" x2="1180" y2="470" class="solid"/>

  <text x="300" y="205" class="small">crea / modifica</text>
  <text x="300" y="455" class="small">recibe / prepara</text>
  <text x="300" y="665" class="small">supervisa</text>
  <text x="300" y="860" class="small">solicita / retira</text>

  <text x="810" y="205" class="small">contiene</text>
  <text x="1020" y="342" class="small">corresponde a</text>
  <text x="1138" y="205" class="small">tiene</text>
  <text x="838" y="455" class="small">tiene</text>
</svg>
